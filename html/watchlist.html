<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist - IMDb</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Header/Navigation -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <span class="logo">MovieSearch</span>
            </div>
            <nav class="navbar-nav">
                <a href="index.html" class="nav-link">Find your film</a>
                <a href="watchlist.html" class="nav-link active">My Watchlist</a>
            </nav>
        </div>
    </header>
 
    <!-- Main Content -->
    <main class="container">
        <section class="watchlist-section">
            <h1 class="page-title">My Watchlist</h1>
            
            <!-- <div class="watchlist-header">
                <p class="search-hint">Search for movies</p>
            </div> -->
 
            <!-- Watchlist Container -->
            <div class="results-container">
                <div id="emptyWatchlist" class="empty-state">
                    <div class="empty-icon">📋</div>
                    <p>Your watchlist is looking a little empty...</p>
                    <a href="index.html" class="add-movies-btn">Let's add some movies!</a>
                </div>
 
                <ul id="watchlistItems" class="results-list">
                    <!-- Watchlist items will be populated here by JavaScript -->
                </ul>
            </div>
        </section>
    </main>
 
    <script type="module" src="/js/watchlist.js"></script>
</body>
</html>
